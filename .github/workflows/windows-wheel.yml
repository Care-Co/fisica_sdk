name: Windows binary wheels

# Manual only (Actions > Run workflow, or gh workflow run): wrappers and platform builds are checked
# when someone asks for it. Verify locally with tools/verify_bindings.py and pytest first.
on:
  workflow_dispatch:
    inputs:
      all_pythons:
        description: Install the wheel on every supported Python (3.9, 3.11, 3.13, 3.14), not only 3.9 and 3.14
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  # A newer run on the same branch replaces the one in progress.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # Core implementation belongs in the private source repository.
    if: github.event.repository.private && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.11'
          architecture: x64
      - uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1
        with:
          arch: x64
      - name: Install build and test dependencies
        run: python -m pip install --upgrade build pytest numpy packaging pyserial bleak
      - name: Build and test the native core
        run: |
          python tools/native_build.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pytest -q
      - name: Verify the C# binding, client and serial transport on Windows
        run: python tools/verify_bindings.py dotnet
      - name: Build and audit binary release artifacts
        run: python tools/build_release.py --validation --output release
      - name: Install and test the release wheel outside the source tree
        run: |
          $wheel = Get-ChildItem release -Recurse -Filter '*-win_amd64.whl'
          if ($wheel.Count -ne 1) { throw 'Expected exactly one Windows x64 wheel' }
          python tools/verify_wheel.py $wheel.FullName
      - name: Store only audited binary artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: fisica-windows-x64
          path: |
            release/**/*-win_amd64.whl
            release/**/fisica-core-*-win_amd64.zip
            release/**/artifact-manifest.json
          if-no-files-found: error
          retention-days: 14

  install:
    needs: build
    runs-on: windows-2022
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # The oldest and newest supported Python (the build job already installs on 3.11); all_pythons adds the rest.
        python: ${{ inputs.all_pythons && fromJSON('["3.9", "3.11", "3.13", "3.14"]') || fromJSON('["3.9", "3.14"]') }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python }}
          architecture: x64
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: fisica-windows-x64
          path: artifacts
      - name: Verify the same wheel on this Python version
        run: |
          $wheel = Get-ChildItem artifacts -Recurse -Filter '*-win_amd64.whl'
          if ($wheel.Count -ne 1) { throw 'Expected exactly one Windows x64 wheel' }
          python tools/verify_wheel.py $wheel.FullName
      - name: Verify the visualization extra
        if: matrix.python == '3.14'
        run: |
          $wheel = Get-ChildItem artifacts -Recurse -Filter '*-win_amd64.whl'
          python tools/verify_wheel.py $wheel.FullName --extras visualization
