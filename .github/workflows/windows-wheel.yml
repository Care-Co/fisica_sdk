name: Windows binary wheels

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'fisica_sdk/**'
      - 'native/**'
      - 'tools/**'
      - 'tests/**'
      - 'wrappers/**/wrapper.json'
      - 'wrappers/flutter/lib/src/version.dart'
      - 'wrappers/flutter/pubspec.yaml'
      - 'sdk-release.json'
      - 'setup.py'
      - 'LICENSE'
      - 'MANIFEST.in'
      - 'pyproject.toml'
      - '.github/workflows/windows-wheel.yml'

permissions:
  contents: read

jobs:
  build:
    # Core implementation belongs in the private source repository.
    if: github.event.repository.private && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.11'
          architecture: x64
      - uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1
        with:
          arch: x64
      - name: Install build and test dependencies
        run: python -m pip install --upgrade build pytest numpy packaging pyserial bleak
      - name: Build and test the native core
        run: |
          python tools/native_build.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pytest -q
      - name: Build and audit binary release artifacts
        run: python tools/build_release.py --output release
      - name: Install and test the release wheel outside the source tree
        run: |
          $wheel = Get-ChildItem release -Recurse -Filter '*-win_amd64.whl'
          if ($wheel.Count -ne 1) { throw 'Expected exactly one Windows x64 wheel' }
          python tools/verify_wheel.py $wheel.FullName
      - name: Store only audited binary artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: fisica-windows-x64
          path: |
            release/**/*-win_amd64.whl
            release/**/fisica-core-*-win_amd64.zip
            release/**/delivery-manifest.json
          if-no-files-found: error
          retention-days: 14

  install:
    needs: build
    runs-on: windows-2022
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ['3.9', '3.11', '3.13', '3.14']
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python }}
          architecture: x64
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: fisica-windows-x64
          path: artifacts
      - name: Verify the same wheel on this Python version
        run: |
          $wheel = Get-ChildItem artifacts -Recurse -Filter '*-win_amd64.whl'
          if ($wheel.Count -ne 1) { throw 'Expected exactly one Windows x64 wheel' }
          python tools/verify_wheel.py $wheel.FullName
      - name: Verify visualization and GUI extras
        if: matrix.python == '3.11'
        run: |
          $wheel = Get-ChildItem artifacts -Recurse -Filter '*-win_amd64.whl'
          python tools/verify_wheel.py $wheel.FullName --extras gui
