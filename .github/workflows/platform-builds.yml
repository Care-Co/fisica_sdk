name: Multi-platform core and bindings
on:
  workflow_dispatch:
  pull_request:
    paths: ['native/**', 'wrappers/**', 'tools/**', 'tests/**', 'sdk-release.json', '.github/workflows/platform-builds.yml']
permissions:
  contents: read
jobs:
  apple:
    if: github.event.repository.private && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with: {persist-credentials: false}
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with: {python-version: '3.11'}
      - run: python -m pip install build pytest numpy packaging pyserial bleak
      - run: python tools/native_build.py
      - run: python -m pytest tests -q
      - run: python tools/build_platforms.py --target apple
        env:
          FISICA_XCODE_DEVELOPER: /Applications/Xcode.app/Contents/Developer
      - run: FISICA_FIXTURES="$GITHUB_WORKSPACE/tests/fixtures" swift test
        working-directory: wrappers/swift
      - run: python tools/build_platforms.py --target macosx_11_0_universal2
      - name: Audit public Apple artifacts
        run: python tools/audit_artifacts.py .build/platforms/apple/fisica-swift-0.1.0.zip .build/platforms/fisica-core-1.3.0-macosx_11_0_universal2.zip
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: fisica-apple-binaries
          path: |
            .build/platforms/apple/*.zip
            .build/platforms/*.zip
          retention-days: 14
  windows-arm64:
    if: github.event.repository.private && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with: {persist-credentials: false}
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with: {python-version: '3.11', architecture: x64}
      - uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756
        with: {arch: amd64_arm64}
      - run: python -m pip install build
      - run: python tools/build_release.py --output release
        env: {FISICA_BUILD_PLATFORM: win_arm64}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: fisica-windows-arm64
          path: |
            release/**/*-win_arm64.whl
            release/**/fisica-core-*-win_arm64.zip
            release/**/delivery-manifest.json
          retention-days: 14
