name: Multi-platform core and bindings
# Manual only (Actions > Run workflow, or gh workflow run): wrappers and platform builds are checked
# when someone asks for it. Verify locally with tools/verify_bindings.py and pytest first.
on:
  workflow_dispatch:

permissions:
  contents: read
concurrency:
  # A newer run on the same branch replaces the one in progress.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  linux:
    # Everything that does not need macOS or Windows runs here. Self-hosted Linux runner (on the
    # company Intel Mac): every step runs in a fresh Ubuntu container, so nothing is installed on the
    # runner itself; downloaded toolchains stay in the fisica-sdk-ci-cache Docker volume.
    if: github.event.repository.private && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: [self-hosted, carenco]
    container:
      image: ubuntu:24.04
      volumes: [fisica-sdk-ci-cache:/cache]
    timeout-minutes: 40
    env:
      PIP_CACHE_DIR: /cache/pip
      PUB_CACHE: /cache/pub-cache
    steps:
      - name: Build tools (Ubuntu packages)
        run: |
          apt-get update -qq
          DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends \
            ca-certificates git curl unzip xz-utils zip g++ python3 python3-venv >/dev/null
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with: {persist-credentials: false}
      - name: Python environment
        run: |
          python3 -m venv /opt/venv
          echo /opt/venv/bin >> "$GITHUB_PATH"
          /opt/venv/bin/python -m pip install -q pytest numpy packaging pyserial bleak opencv-python-headless Pillow
      - run: python tools/native_build.py
      - run: python -m pytest tests -q
      - name: Public C ABI contracts under UBSan (hostile license input included)
        run: python tools/verify_bindings.py native
      - name: Flutter 3.47.7 (pinned source, kept in the cache volume)
        run: |
          sdk=/cache/flutter-3.47.7
          if [ "$(git -C "$sdk" rev-parse HEAD 2>/dev/null)" != abaf9c523780a608bd46686fd5e53740a07077f8 ]; then
            rm -rf "$sdk"
            git init "$sdk"
            git -C "$sdk" remote add origin https://github.com/flutter/flutter.git
            git -C "$sdk" fetch --depth 1 origin abaf9c523780a608bd46686fd5e53740a07077f8
            git -C "$sdk" fetch --depth 1 origin tag 3.47.7
            git -C "$sdk" checkout --detach abaf9c523780a608bd46686fd5e53740a07077f8
          fi
          echo "$sdk/bin" >> "$GITHUB_PATH"
      - run: flutter --disable-analytics
      - name: Dart core wrapper contract (client, reconnect, link check, license, mock server)
        run: python tools/verify_bindings.py dart
      - run: flutter pub get
        working-directory: wrappers/flutter_transport
      - run: flutter analyze
        working-directory: wrappers/flutter_transport
      - name: Adapter failures, MTU and shared-core measurement through fake BLE
        run: flutter test
        working-directory: wrappers/flutter_transport
        env:
          FISICA_CORE_TEST_LIBRARY: ${{ github.workspace }}/fisica_sdk/_native/libfisica_core.so
      - run: flutter pub get
        working-directory: examples/partner/flutter
      - run: flutter analyze
        working-directory: examples/partner/flutter
      - run: flutter build bundle --debug
        working-directory: examples/partner/flutter
  android:
    # Self-hosted Linux runner, in a fresh Ubuntu container like the linux job. The Android SDK,
    # NDK 26.3 (the version verified locally) and Gradle 8.14 (Kotlin 2.0.21 compiler jars) are
    # downloaded once into the fisica-sdk-ci-cache volume.
    if: github.event.repository.private && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: [self-hosted, carenco]
    container:
      image: ubuntu:24.04
      volumes: [fisica-sdk-ci-cache:/cache]
    timeout-minutes: 40
    env:
      CXX: clang++
      JAVA_HOME: /usr/lib/jvm/java-17-openjdk-amd64
    steps:
      - name: Build tools (Ubuntu packages)
        run: |
          apt-get update -qq
          DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends \
            ca-certificates git curl unzip clang python3 openjdk-17-jdk-headless >/dev/null
          echo "$JAVA_HOME/bin" >> "$GITHUB_PATH"
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with: {persist-credentials: false}
      - name: Android NDK, android-35 platform and Gradle's Kotlin compiler (cached)
        run: |
          sdk=/cache/android-sdk; tools="$sdk/cmdline-tools/latest/bin"
          if [ ! -x "$tools/sdkmanager" ]; then
            curl -fsSL -o /tmp/tools.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
            mkdir -p "$sdk/cmdline-tools" && unzip -q /tmp/tools.zip -d /tmp/tools && rm -rf "$sdk/cmdline-tools/latest"
            mv /tmp/tools/cmdline-tools "$sdk/cmdline-tools/latest"
          fi
          yes | "$tools/sdkmanager" --sdk_root="$sdk" --licenses >/dev/null
          "$tools/sdkmanager" --sdk_root="$sdk" "platforms;android-35" "ndk;26.3.11579264" >/dev/null
          gradle=/cache/gradle-8.14
          if [ ! -d "$gradle/lib" ]; then
            curl -fsSL -o /tmp/gradle.zip https://services.gradle.org/distributions/gradle-8.14-bin.zip
            unzip -q /tmp/gradle.zip -d /cache
          fi
          ls "$gradle"/lib/kotlin-compiler-embeddable-*.jar
          { echo "FISICA_ANDROID_NDK=$sdk/ndk/26.3.11579264"; echo "ANDROID_SDK_ROOT=$sdk"; echo "FISICA_GRADLE_LIB=$gradle/lib"; } >> "$GITHUB_ENV"
      - name: Python is python3
        run: mkdir -p /opt/bin && ln -sf "$(command -v python3)" /opt/bin/python && echo /opt/bin >> "$GITHUB_PATH"
      - name: Android libraries for 16 KB pages (LOAD alignment and RELRO end checked), and the AAR
        run: python tools/build_platforms.py --validation --target android
      - name: Audit public Android artifacts (16 KB LOAD and RELRO checks included)
        run: python tools/audit_artifacts.py $(python tools/build_platforms.py --print-artifacts android)
      - name: Kotlin contract (client, link check, entitlement, mock server)
        run: python tools/verify_bindings.py kotlin
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        continue-on-error: true  # artifact storage is billed to the account; the checks above are the result
        with:
          name: fisica-android
          path: |
            .build/platforms/android/*.aar
            .build/platforms/android/*.zip
          retention-days: 14
  windows-arm64:
    # GitHub-hosted: there is no self-hosted Windows runner.
    if: github.event.repository.private && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with: {persist-credentials: false}
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with: {python-version: '3.11', architecture: x64}
      - uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756
        with: {arch: amd64_arm64}
      - run: python -m pip install build
      - run: python tools/build_release.py --validation --output release
        env: {FISICA_BUILD_PLATFORM: win_arm64}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: fisica-windows-arm64
          path: |
            release/**/*-win_arm64.whl
            release/**/fisica-core-*-win_arm64.zip
            release/**/artifact-manifest.json
          retention-days: 14
