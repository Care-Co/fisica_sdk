openapi: 3.0.3
info:
  title: Fisica SDK license API
  version: 0.3.0-draft
  description: |
    Contract between the SDK and the Care&Co server (policy of 2026-10-17: SDK keys as seats,
    basic and full mode). The server is the Fisica developer portal (Care-Co/developer-portal) at
    https://developer.fisicahealthcare.com; `tools/entitlement_dev.py` is the reference mock used by
    the tests.

    The SDK calls four endpoints: activate (once per key, sending the key and this app's or PC's
    target), refresh (renewal of the same key, empty body), and pairing and pairing token for an
    SDK without a key (device authorization as in RFC 8628: the SDK sends only its target, shows a
    code, and receives a key that an owner or admin approved in the portal). There is no usage,
    activity or telemetry endpoint. Trial, extension and contract requests, approval, creating keys,
    approving pairing codes (`/activate`), offline activation files, renewal files and release codes
    happen in the developer portal, authenticated as a company user; they are not SDK calls and are
    not specified here.

    Rules the server must keep:
    - No SDK usage tracking. The server does not receive, derive or store whether the SDK was
      used, when it was last used, use after a grant ended, or counts of measurements or API calls.
      It stores per key only the target it is activated for and the times it was activated,
      renewed and released, for seat and trial administration.
    - A refresh is not a usage record. Do not present the last renewal as the last time the SDK
      was used, and do not infer real use or contract compliance from renewal history: offline
      use and use without renewing never reach the server.
    - The company, contract and key are taken ONLY from the verified bearer token. Identifiers in a
      request body are never trusted; the activation body carries the target only.
    - The token ships inside partner apps. Treat it as a credential for its own seat: it
      authorizes activating and renewing itself and nothing else. Rate-limit every endpoint.
    - Pairing is unauthenticated. The device code is a secret only the SDK holds (the server keeps
      its hash); the user code is short-lived (10 minutes), single-use and shown to the approver with
      the target (an app ID, or only the first 8 characters of a PC hash) and the request time. The
      approver must be an owner or admin of the organization the key comes from; seat, move-cap and
      trial rules are those of activation.
    - The SDK core decides the mode from signed fields only. A refused or failed request leaves
      the SDK with the key it had; the SDK never treats a network failure as an expiry, a release
      or a revocation.
    - Keep the facts separate: the key's own expiry (`key_until`), the end of full mode for the
      grant (`full_until`: trial end, extension end, or contract end plus grace), the contract
      dates and the server confirmation time (`verified_at`/`refresh_by`). Never merge them into
      one `expires_at`.
    - Ending a grant ends full mode only. Basic mode, hardware ownership and device registration
      stay; do not model it as a subscription/payment state of NONE or a device state of REVOKED.
    - The signing private key (Ed25519) stays on the server. The SDK embeds public keys by `kid`.
servers:
  - url: https://{host}
    variables: {host: {default: developer.fisicahealthcare.com, description: Fisica developer portal}}
security:
  - sdkKey: []
paths:
  /sdk/v1/entitlement/activate:
    post:
      summary: Activate an SDK key for this app or PC and return the bound key.
      description: |
        The body is the SDK core's activation request, built from the target the core reads
        itself: `{"bind_type": "app"|"pc", "bind": "<app ID or PC hash>"}` and nothing else.
        Activating again for the same target (an app's `.debug`/`.dev` build is the same app)
        renews the key and returns it; another target is refused. An app ID belongs to one
        contract at a time; a PC holds at most one key of a contract. A trial key claims the
        target, so a target can take part in one trial only.
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/Target'}}}
      responses:
        '200':
          description: The key activated for the target.
          content: {application/json: {schema: {type: object, required: [token], properties: {token: {$ref: '#/components/schemas/Token'}}}}}
        '400': {description: '`invalid_json`, `unexpected_body` (other members or types) or `invalid_target` (not an app ID or PC hash).', content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '401': {description: Missing token, bad signature, unknown signing key, unknown contract, or a token without a seat key., content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '409': {description: '`key_in_use` (activated for another target), `target_already_bound` (the contract already has a key here), `app_in_another_contract`, `trial_used` (the target took part in a trial) or `key_released`.', content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '429': {description: Rate limited; retry after the `Retry-After` header. The SDK keeps what it had.}
        '503': {description: Temporarily unavailable. The SDK keeps what it had.}
  /sdk/v1/entitlement/refresh:
    post:
      summary: Renew the key and return it newly signed with the current grant.
      description: |
        Accepts any key whose signature verifies, including an expired one. The response is signed
        with `verified_at` = server time now, a renewed `key_until` (now plus the validity chosen
        when the key was created) and the grant's current dates and features. Full mode still ends
        at `full_until`: the core uses the earlier of the two.
        A key released in the portal (or its device-side release completed) and a revoked contract
        are answered with 200 and a key carrying `revoked_at`; the SDK then drops to basic mode and
        forgets the key, and the portal records the release as done by the device.
        The request body is an empty object. Anything else is refused, so no activity or
        device information can be sent through this endpoint.
      requestBody: {required: true, content: {application/json: {schema: {type: object, additionalProperties: false}}}}
      responses:
        '200':
          description: The newly signed key.
          content: {application/json: {schema: {type: object, required: [token], properties: {token: {$ref: '#/components/schemas/Token'}}}}}
        '400': {description: Body is not an empty object., content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '401': {description: Missing token, bad signature, unknown signing key or unknown contract., content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '429': {description: Rate limited. The SDK keeps what it had.}
        '503': {description: Temporarily unavailable. The SDK keeps what it had.}
  /sdk/v1/pairing:
    post:
      summary: Start pairing an SDK without a key; answers the codes.
      security: []
      description: |
        The body is the SDK core's activation request (`Target`), exactly as for activate. The answer
        holds `device_code` (kept by the SDK, sent only to the token endpoint), `user_code`
        (`XXXX-XXXX`, consonants only, shown to the person), `verification_uri` (the portal's
        `/activate` page), `verification_uri_complete` (the same with `?code=`), `expires_in` (600)
        and `interval` (seconds between polls, 5).
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/Target'}}}
      responses:
        '200':
          description: The codes.
          content:
            application/json:
              schema:
                type: object
                required: [device_code, user_code, verification_uri, verification_uri_complete, expires_in, interval]
                properties:
                  device_code: {type: string}
                  user_code: {type: string, pattern: '^[BCDFGHJKLMNPQRSTVWXZ]{4}-[BCDFGHJKLMNPQRSTVWXZ]{4}$'}
                  verification_uri: {type: string}
                  verification_uri_complete: {type: string}
                  expires_in: {type: integer}
                  interval: {type: integer}
        '400': {description: '`invalid_json`, `unexpected_body` or `invalid_target`.', content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '429': {description: Rate limited; retry after the `Retry-After` header.}
  /sdk/v1/pairing/token:
    post:
      summary: Poll for the key approved for a pairing.
      security: []
      description: |
        Body `{"device_code": "..."}` and nothing else. Until an owner or admin approves the user code
        the answer is 400 `authorization_pending`; polling faster than `interval` gives `slow_down`
        (add 5 seconds to the interval). A denied code gives `access_denied`; an expired, unknown or
        already used device code gives `expired_token`. Approval activates a key (new, or an unbound
        one of the chosen trial or contract) for the target, so the 200 answer is a key bound to this
        app or PC. It is given once. A key approved just before the code expired can still be
        received for a short while; a key released in the portal before it was received gives
        `access_denied`.
      requestBody:
        required: true
        content: {application/json: {schema: {type: object, additionalProperties: false, required: [device_code], properties: {device_code: {type: string}}}}}
      responses:
        '200':
          description: The approved key, activated for the target.
          content: {application/json: {schema: {type: object, required: [token], properties: {token: {$ref: '#/components/schemas/Token'}}}}}
        '400': {description: '`authorization_pending`, `slow_down`, `access_denied`, `expired_token`, `invalid_json` or `unexpected_body`.', content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '429': {description: Rate limited; retry after the `Retry-After` header.}
components:
  securitySchemes:
    sdkKey: {type: http, scheme: bearer, bearerFormat: FSE1}
  schemas:
    Target:
      type: object
      additionalProperties: false
      required: [bind_type, bind]
      properties:
        bind_type: {type: string, enum: [app, pc]}
        bind:
          type: string
          description: |
            `app`: reverse-DNS app ID `[A-Za-z0-9][A-Za-z0-9_-]*(\.[A-Za-z0-9_-]+)+`, at most 128 characters
            (iOS/macOS bundle ID or Android package name). `pc`: 64 lowercase hex characters,
            SHA-256 of `fisica-pc-v1:` + the platform machine identifier.
    Token:
      type: string
      maxLength: 4096
      description: |
        `FSE1.<base64url(payload)>.<base64url(signature)>`, no padding. The signature is
        Ed25519 (RFC 8032) over the ASCII bytes `FSE1.<base64url(payload)>`.
        The same string is the content of a key file (`.fse`).
        Payload: one flat JSON object, ASCII, no string escapes, members:
        - `v` (integer, required): 1
        - `kid` (string, required): signing key id known to the SDK build
        - `company`, `contract` (string, required): `[A-Za-z0-9_.:-]{1,64}`; `contract` is the
          grant's reference number
        - `kind` (string, required): `basic` (trial, extension) or `special` (commercial contract)
        - `verified_at` (integer, required): time the server signed this key, Unix seconds.
          It is not a time of SDK use.
        - `refresh_by` (integer, required): > `verified_at`; the SDK caps it at `verified_at` + 30 days
          and renews online after it
        - `contract_start`, `contract_end` (integer, optional): grant dates; omit when none
        - `revoked_at` (integer, optional): the key was released or the contract revoked
        - `grants` (string, optional): comma list such as `oem,rebrand,resale`; at most 256 characters
        - `key` (string): the seat key id, `[A-Za-z0-9_.:-]{1,64}`. A token without it is a legacy
          contract token and gives basic mode only.
        - `bind_type`, `bind` (string, optional): the target the key is activated for (see `Target`);
          both absent on an unactivated key
        - `key_until` (integer, optional): end of the key's validity; absent for "no expiry" and on
          an unactivated key
        - `full_until` (integer): end of full mode for the grant; absent means no full mode
        - `features` (string, optional): comma list of `raw_data`, `export`, `advanced`; absent means all.
          Names the core does not know open nothing.
        - `track` (string, optional): `trial`, `extension` or `contract`
        Unknown members are ignored; duplicate members are rejected.
    Error:
      type: object
      properties: {error: {type: string}}
