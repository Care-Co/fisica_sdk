name: fisica_core
description: Fisica Scale native core FFI wrapper for Dart and Flutter host apps.
version: 0.4.0
publish_to: none
environment:
  sdk: '>=3.9.0 <4.0.0'
dependencies:
  ffi: ^2.1.4
  pub_semver: ^2.2.0
dev_dependencies:
  crypto: ^3.0.0
  test: ^1.25.0

flutter:
  plugin:
    platforms:
      android:
        ffiPlugin: true
      ios:
        ffiPlugin: true
      macos:
        ffiPlugin: true
      windows:
        ffiPlugin: true
